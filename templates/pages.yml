# Docs site on GitHub Pages (docs-policy.md "Published site"). Copy to .github/workflows/pages.yml.
name: Docs site

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "DESIGN.md", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Repo-relative paths kept so links like ../DESIGN.md resolve; README.md is the home page.
      - name: Stage docs
        run: |
          mkdir site
          cp -r docs README.md site/
          for f in DESIGN.md CHANGELOG.md; do [ -f "$f" ] && cp "$f" site/; done
          printf 'title: %s docs\n' "${GITHUB_REPOSITORY#*/}" > site/_config.yml
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
